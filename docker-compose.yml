services:
  postgres:
    image: postgres:16-alpine
    container_name: calendai-postgres
    environment:
      POSTGRES_DB: calendai
      POSTGRES_USER: calendai
      POSTGRES_PASSWORD: calendai_dev
    volumes:
      - calendai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendai -d calendai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./CalendarioBackend
      dockerfile: src/CalendarioBackend.Api/Dockerfile
    container_name: calendai-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Calendario: Host=postgres;Port=5432;Database=calendai;Username=calendai;Password=calendai_dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./CalendarioFrontend
      dockerfile: Dockerfile
    container_name: calendai-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  calendai-postgres-data:
