services:
  postgres:
    image: postgres:16
    container_name: calendai-postgres
    environment:
      POSTGRES_DB: calendai
      POSTGRES_USER: calendai_user
      POSTGRES_PASSWORD: calendai_password
    ports:
      - "5432:5432"
    volumes:
      - calendai_postgres_data:/var/lib/postgresql/data
      - ./CalendarioBackend/database:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  backend:
    build:
      context: ./CalendarioBackend
      dockerfile: src/CalendarioBackend.Api/Dockerfile
    container_name: calendai-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Calendai: Host=postgres;Port=5432;Database=calendai;Username=calendai_user;Password=calendai_password
    ports:
      - "5080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./CalendarioFrontend
      dockerfile: Dockerfile
    container_name: calendai-frontend
    depends_on:
      - backend
    ports:
      - "5500:80"
    restart: unless-stopped

volumes:
  calendai_postgres_data:
